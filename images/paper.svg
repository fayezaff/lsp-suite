<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480">
  <!-- charcoal cold-press watercolor paper: tooth from lit noise, plus faint mottling. Tiles seamlessly. -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.2" diffuseConstant="1" lighting-color="#33383e" result="lit">
      <feDistantLight azimuth="235" elevation="58"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.62  0 0 0 0 0.70  0 0 0 -1.6 0.9"/>
  </filter>
  <rect width="480" height="480" fill="#23272b"/>
  <rect width="480" height="480" filter="url(#tooth)" opacity="0.5"/>
  <rect width="480" height="480" filter="url(#mottle)" opacity="0.05"/>
</svg>
